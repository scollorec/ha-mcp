name: Publish HA-MCP-SCO preview

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/publish-ha-mcp-sco-preview.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ha-mcp-sco-preview-release
  cancel-in-progress: false

jobs:
  publish-preview:
    if: github.repository == 'scollorec/ha-mcp'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token for protected tag creation
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
        continue-on-error: true

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Create GitHub prerelease and tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="9.2.1-beta.1"

          # The component's internal version and server pin stay aligned at 9.2.0.
          # The GitHub release tag is only HACS's distribution selector.
          python3 - <<'PY'
          import json
          manifest = json.load(open("custom_components/ha_mcp_tools/manifest.json"))
          if manifest["version"] != "9.2.0":
              raise SystemExit(f"Unexpected component version: {manifest['version']}")
          if "ha-mcp==9.2.0" not in manifest["requirements"]:
              raise SystemExit("Component server pin is not ha-mcp==9.2.0")
          PY

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Refusing to alter an existing release."
            exit 1
          fi

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists without a release. Refusing to attach a release to an unverified tag."
            exit 1
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "HA-MCP-SCO $TAG" \
            --notes "Preview release of HA-MCP-SCO with the optional generic remote MCP provider. The integration component and embedded server remain version-aligned at 9.2.0. Enable beta releases in HACS to select this preview." \
            --prerelease

          TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          if [[ "$TAG_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Created tag resolves to $TAG_SHA, expected $GITHUB_SHA."
            exit 1
          fi

          echo "Published $TAG at $GITHUB_SHA."
